name: infra-workflow

on:
  workflow_dispatch:
  
env:
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
  ARM_USE_CLI: false

jobs:
  # Job 1: Infrastructure Azure uniquement
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.4.0'
          terraform_wrapper: false
          
      # Step 3: Azure Login
      - name: Set up Azure Credentials
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 3: Bootstrap backend if needed
      - name: Ensure backend exists
        run: |
          az group create --name rg-terraform-backend --location westeurope || true
          az storage account create --name tfbackend62400 --resource-group rg-terraform-backend --sku Standard_LRS || true
          az storage container create --name tfstate --account-name tfbackend62400 || true

      # Step 3: Terraform Init Infra
      - name: Terraform Init Infrastructure
        run: |
          cd infra/
          terraform init -upgrade

      # Step 4: Terraform Plan Infra
      - name: Terraform Plan Infrastructure
        run: |
          cd infra/
          terraform plan -out=tfplan

      # Step 5: Terraform Apply Infra
      - name: Terraform Apply Infrastructure
        run: |
          cd infra/
          terraform apply -auto-approve tfplan

  # Job 2: Kubernetes
  kubernetes:
    needs: infra
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.4.0'
          terraform_wrapper: false

      # Step 3: Azure Login
      - name: Set up Azure Credentials
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 4: Configure kubectl
      - name: Configure kubectl
        run: |
          az aks get-credentials \
            --resource-group rg-1 \
            --name cluster-aks \
            --admin \
            --overwrite-existing

      # Step 5: Terraform Init K8s
      - name: Terraform Init Kubernetes
        run: |
          cd k8s/
          terraform init -upgrade

      # Step 6: Terraform Plan K8s
      - name: Terraform Plan Kubernetes
        run: |
          cd k8s/
          terraform plan -out=tfplan
        env:
          TF_VAR_fluxcd_key: ${{ secrets.FLUXCD_KEY }}
          TF_VAR_fluxcd_key_pub: ${{ secrets.FLUXCD_KEY_PUB }}
          TF_VAR_known_hosts: ${{ secrets.KNOWN_HOSTS }}

      # Step 7: Terraform Apply K8s
      - name: Terraform Apply Kubernetes
        run: |
          cd k8s/
          terraform apply -auto-approve tfplan
        env:
          TF_VAR_fluxcd_key: ${{ secrets.FLUXCD_KEY }}
          TF_VAR_fluxcd_key_pub: ${{ secrets.FLUXCD_KEY_PUB }}
          TF_VAR_known_hosts: ${{ secrets.KNOWN_HOSTS }}

      # Step 8: Final check
      - name: Verify Deployment
        run: |
          kubectl get namespaces
          kubectl get pods -n flux-system
          kubectl get secrets -n flux-system
          helm list -n flux-system
